# electron-builder config for Pi Agent desktop.
# Docs: https://www.electron.build/configuration
#
# Build with:  npm run desktop:build
#   (runs `next build --webpack` first to produce .next/standalone/, then this)
#
# Output by host platform:
#   Windows -> dist-electron/Pi Agent Setup <version>.exe      (NSIS, perUser, x64)
#   macOS   -> dist-electron/Pi Agent-<version>-arm64.dmg
#              dist-electron/Pi Agent-<version>-x64.dmg
#
# Layout after packaging (same on both platforms):
#   resources/app/        <- Electron app package (main.cjs, lib, seeds, icon)
#   resources/server/     <- Next.js standalone server (server.js + node_modules)
#   resources/node/       <- Node 22 runtime (node.exe on Windows, node on macOS)
# main.cjs finds the server at process.resourcesPath/server and the runtime at
# process.resourcesPath/node.

appId: works.earendil.pi-agent
productName: Pi Agent
copyright: Copyright © 2026

directories:
  output: dist-electron
  buildResources: desktop

# Skip copying the project's node_modules into resources/app/. The main process
# needs no npm deps (electron is runtime-injected; everything else is either a
# Node builtin or a local ./lib/*.cjs). The Next server + pi SDK live in the
# standalone bundle under resources/server/ (extraResources) with their own
# node_modules. Without this hook, electron-builder duplicates ~740 MB of deps
# into the app package. See desktop/skip-deps.js.
beforeBuild: desktop/skip-deps.js

# Ad-hoc (re)sign the .app on macOS after packing. Without this an unsigned
# arm64 build is rejected by macOS as "damaged" once it carries the quarantine
# attribute (downloaded dmg). electron-builder's own signing is disabled via
# mac.identity: null, so we do a plain `codesign --sign -` here. No-op on Windows.
afterPack: desktop/after-pack-sign.cjs

# What goes into the Electron app package (resources/app/). The desktop entry
# + helpers are FLATTENED to the app root (not kept under desktop/) so that
# main.cjs's relative requires ("./lib/port") resolve correctly under Electron's
# module loader.
#
# Syntax note (verified empirically against app-builder-lib 25.1.8):
#   - Single-file FileSets `{from: "desktop/main.cjs", to: "main.cjs"}` do NOT
#     work in this version (the file is silently skipped). Directory FileSets
#     DO work: `from: "desktop", to: "."` copies desktop/main.cjs ->
#     resources/app/main.cjs, desktop/lib/port.cjs -> resources/app/lib/port.cjs
#     (getDestinationPath uses path.relative(src, file), stripping the desktop/
#     prefix). So we copy the WHOLE desktop/ dir flat to the app root and use
#     `filter` to drop build-only files we don't want shipped.
#   - We avoid plain-string entries (like "package.json"): those create a
#     default matcher with from=appDir that pulls in `**/*` (the entire project
#     incl. node_modules). Instead package.json is copied via its own FileSet
#     with from=appDir, filter ["package.json"] — no `**/*` fallback.
files:
  - from: desktop
    to: .
    filter:
      - "**/*"
      - "!make-icon.mjs"
      - "!after-pack-sign.cjs"
      - "!win-eperm-patch.cjs"
      - "!electron-builder.yml"
      # Build-only helpers: not required at runtime (the standalone server and
      # pi SDK live in resources/server). Keeps resources/app/ minimal.
      - "!fetch-node.cjs"
      - "!ensure-standalone-chunks.cjs"
      - "!skip-deps.js"
      # The Node runtime ships via extraResources (resources/node/) — don't let
      # the `**/*` glob duplicate the ~80 MB binary inside resources/app/.
      - "!node-runtime/**"
      - "!icon-build/**"
      - "!*.md"
  - from: .
    to: .
    filter:
      - "package.json"

# The standalone Next server is large and self-contained; ship it as resources
# (not inside the app package) so it sits at resources/server/server.js.
# `from` paths are relative to the project root (package.json dir).
extraResources:
  - from: .next/standalone
    to: server
    filter: ["**/*"]
  - from: .next/static
    to: server/.next/static
    filter: ["**/*"]
  # Ship a real Node 22 runtime. The Next.js standalone server.js is run with
  # THIS node binary, not electron.exe (ELECTRON_RUN_AS_NODE). Reason: Electron
  # 33 embeds Node 20.18, whose built-in undici/worker_threads lacks
  # `markAsUncloneable` — Next 16.2.9's @edge-runtime/primitives calls it, so
  # any API route touching the pi SDK throws "webidl.util.markAsUncloneable is
  # not a function" (HTTP 500). Node 22 has the API. Lands at resources/node/.
  #
  # The runtime directory holds only the binary for the host platform/arch
  # (node.exe on Windows, node on macOS — see desktop/fetch-node.cjs), so we copy
  # that whole directory; `node*` matches either name.
  - from: desktop/node-runtime
    to: node
    filter: ["node*"]

# asar disabled for v1: the pi SDK does dynamic import(), absolute-path wasm
# reads, and package.json walk-ups that can break inside an asar archive.
asar: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: desktop/icon.ico

nsis:
  oneClick: false                      # normal install wizard (allow dir change)
  perMachine: false                    # perUser -> %LOCALAPPDATA%\Programs, no admin
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pi Agent
  uninstallDisplayName: Pi Agent

# macOS: one dmg per architecture. electron-builder can build the x64 dmg on an
# Apple Silicon host (it cross-packages), so a single M-series Mac produces both.
# Docs: desktop-mac-plan.zh-CN.md / desktop-build-mac.zh-CN.md.
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: desktop/icon.icns
  category: public.app-category.developer-tools
  # Always include the architecture in the dmg name. Without this electron-builder
  # drops the suffix for the "default" arch (x64), producing a confusing
  # `Pi Agent-0.8.0.dmg` next to `Pi Agent-0.8.0-arm64.dmg`.
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # Unsigned distribution (no Apple Developer account). identity: null stops
  # electron-builder from trying to discover a certificate; the app is then
  # ad-hoc signed by desktop/after-pack-sign.cjs. Users still need one
  # right-click > Open (or `xattr -rd com.apple.quarantine`) on first launch.
  identity: null
  hardenedRuntime: false               # required=false when not notarizing
  gatekeeperAssess: false              # no signed dmg to assess
  # Electron 33's minimum supported macOS.
  minimumSystemVersion: "10.15"

dmg:
  # Plain drag-to-Applications layout.
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
